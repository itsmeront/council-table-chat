# Build the Vite app and deploy it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --legacy-peer-deps: @testing-library/react@14 predates react 19; the
      # dev tree installs the same way. Runtime deps are unaffected.
      - run: npm ci --legacy-peer-deps
      # GATE: declared pin must equal what npm ci installed. npm ci obeys the
      # LOCKFILE, so a stale lockfile silently overrides a corrected pin.
      - run: node check_kernel_pin.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
